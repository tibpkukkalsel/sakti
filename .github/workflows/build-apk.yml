name: Build Android APK (E-Lapor Samkel)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p output-apk
          if [ -f android/app/build/outputs/apk/debug/E-Lapor-Samkel.apk ]; then
            cp android/app/build/outputs/apk/debug/E-Lapor-Samkel.apk output-apk/E-Lapor-Samkel.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/E-Lapor-Samkel.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: E-Lapor-Samkel-APK
          path: output-apk/E-Lapor-Samkel.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: "E-Lapor SAMKEL APK (Domain Baru)"
          files: output-apk/E-Lapor-Samkel.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
